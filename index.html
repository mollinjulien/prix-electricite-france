<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prix de l'électricité de demain</title>
  <meta name="description" content="Prévision du prix day-ahead de l'électricité en France par trois modèles de machine learning, comparée chaque jour au prix du marché.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M18 2 6 18h8l-2 12 12-16h-8z' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=5">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="app.js?v=5" defer></script>
</head>
<body>
  <header class="entete">
    <div class="entete-haut">
      <div>
        <h1 data-t="titre"></h1>
        <p class="sous-titre" data-t="sous_titre"></p>
      </div>
      <div class="reglages">
        <button type="button" id="langue" class="bouton-discret" aria-label="Language / langue">EN</button>
        <button type="button" id="theme" class="bouton-discret" aria-label="Thème clair ou sombre">◐</button>
      </div>
    </div>
    <nav class="onglets" role="tablist" aria-label="Sections">
      <button type="button" role="tab" id="tab-prevision" data-onglet="prevision" aria-controls="prevision" data-t="o_prevision"></button>
      <button type="button" role="tab" id="tab-historique" data-onglet="historique" aria-controls="historique" data-t="o_historique"></button>
      <button type="button" role="tab" id="tab-performance" data-onglet="performance" aria-controls="performance" data-t="o_performance"></button>
      <button type="button" role="tab" id="tab-production" data-onglet="production" aria-controls="production" data-t="o_production"></button>
      <button type="button" role="tab" id="tab-modeles" data-onglet="modeles" aria-controls="modeles" data-t="o_modeles"></button>
      <button type="button" role="tab" id="tab-sources" data-onglet="sources" aria-controls="sources" data-t="o_sources"></button>
    </nav>
  </header>

  <main>
    <!-- ============================================================ PRÉVISION -->
    <section id="prevision" role="tabpanel" aria-labelledby="tab-prevision" class="panneau">
      <div id="bandeau-retard" class="alerte echec" hidden></div>
      <p id="maj" class="maj"></p>
      <div id="prev-haut" class="bloc-jour"></div>
      <div id="prev-bas" class="bloc-jour second"></div>
    </section>

    <!-- ============================================================ HISTORIQUE -->
    <section id="historique" role="tabpanel" aria-labelledby="tab-historique" class="panneau" hidden>
      <div class="segments grands" id="hist-mode" role="group"></div>

      <div id="hist-jour">
        <div class="carte">
          <div class="navigation-jour">
            <button type="button" id="hist-prec" class="bouton" aria-label="Jour précédent">‹</button>
            <input type="date" id="hist-date" aria-label="Date">
            <button type="button" id="hist-suiv" class="bouton" aria-label="Jour suivant">›</button>
            <span id="hist-badge" class="badge"></span>
          </div>
          <div class="tuiles" id="hist-tuiles"></div>
        </div>
        <div class="carte">
          <div class="barre-outils">
            <h3 class="petit-titre" id="hist-sous-titre"></h3>
            <div class="segments" id="hist-pas" role="group"></div>
          </div>
          <div class="choix" id="hist-choix"></div>
          <div class="duo large">
            <div class="cadre-table"><table id="hist-table" class="table-donnees"></table></div>
            <div class="graphique"><canvas id="hist-graphique" role="img"></canvas></div>
          </div>
          <p class="note" data-t="note_ecarts"></p>
        </div>
      </div>

      <div id="hist-plage" hidden>
        <div class="carte">
          <div class="barre-outils">
            <div class="segments" id="plage-presets" role="group"></div>
            <div class="dates-perso">
              <label><span data-t="du"></span> <input type="date" id="plage-debut"></label>
              <label><span data-t="au"></span> <input type="date" id="plage-fin"></label>
            </div>
          </div>
          <div class="barre-outils">
            <h3 class="petit-titre" id="plage-sous-titre"></h3>
            <div class="segments" id="plage-pas" role="group"></div>
          </div>
          <div class="choix" id="plage-choix"></div>
          <div class="graphique haut"><canvas id="plage-graphique" role="img"></canvas></div>
        </div>
        <div class="carte">
          <h3 class="petit-titre" data-t="jour_par_jour"></h3>
          <p class="note" data-t="clic_jour"></p>
          <div class="choix" id="plage-choix2"></div>
          <div class="cadre-table libre"><table id="plage-table" class="table-donnees cliquable"></table></div>
        </div>
      </div>
    </section>

    <!-- ============================================================ PERFORMANCE -->
    <section id="performance" role="tabpanel" aria-labelledby="tab-performance" class="panneau" hidden>
      <div class="carte">
        <p class="intro" data-t="intro_perf"></p>
        <div class="segments" id="perf-periode" role="group"></div>
        <div class="choix" id="perf-choix"></div>
        <div class="cadre-table libre"><table id="perf-resume" class="table-donnees"></table></div>
      </div>
      <div class="deux-cartes">
        <div class="carte">
          <h3 class="petit-titre" data-t="perf_jours"></h3>
          <div class="graphique"><canvas id="perf-jours" role="img"></canvas></div>
        </div>
        <div class="carte">
          <h3 class="petit-titre" data-t="perf_heures"></h3>
          <div class="graphique"><canvas id="perf-heures" role="img"></canvas></div>
        </div>
      </div>
      <div class="carte">
        <h3 class="petit-titre" data-t="perf_difficiles"></h3>
        <p class="note" data-t="clic_jour"></p>
        <div class="choix" id="perf-choix2"></div>
        <div class="cadre-table libre"><table id="perf-difficiles" class="table-donnees cliquable"></table></div>
      </div>
    </section>

    <!-- ============================================================ PRODUCTION (bonus) -->
    <section id="production" role="tabpanel" aria-labelledby="tab-production" class="panneau" hidden>
      <div class="carte">
        <h3 class="petit-titre" data-t="prod_titre"></h3>
        <p class="intro" data-t="intro_prod"></p>
        <details class="plus"><summary data-t="prod_details"></summary><div class="fiches" id="prod-modeles"></div></details>
      </div>
      <div class="carte">
        <div class="navigation-jour">
          <button type="button" id="prod-prec" class="bouton" aria-label="Jour précédent">‹</button>
          <input type="date" id="prod-date" aria-label="Date">
          <button type="button" id="prod-suiv" class="bouton" aria-label="Jour suivant">›</button>
          <span id="prod-badge" class="badge"></span>
        </div>
        <div class="tuiles" id="prod-tuiles"></div>
      </div>
      <div class="deux-cartes">
        <div class="carte"><h3 class="petit-titre" data-t="prod_solaire"></h3><div class="graphique moyen"><canvas id="prod-g-sol" role="img"></canvas></div></div>
        <div class="carte"><h3 class="petit-titre" data-t="prod_eolien"></h3><div class="graphique moyen"><canvas id="prod-g-eol" role="img"></canvas></div></div>
      </div>
      <div class="deux-cartes droite">
        <div class="carte"><h3 class="petit-titre" data-t="prod_heure"></h3><div class="cadre-table"><table id="prod-table" class="table-donnees"></table></div></div>
        <div class="carte"><h3 class="petit-titre" data-t="prod_regions"></h3><div class="cadre-table libre"><table id="prod-regions" class="table-donnees"></table></div></div>
      </div>
      <div class="carte">
        <h3 class="petit-titre" data-t="prod_historique"></h3>
        <p class="note" data-t="prod_hist_note"></p>
        <div class="tuiles" id="prod-perf"></div>
      </div>
      <div class="deux-cartes">
        <div class="carte"><h3 class="petit-titre" data-t="prod_hist_sol"></h3><div class="graphique moyen"><canvas id="prod-h-sol" role="img"></canvas></div></div>
        <div class="carte"><h3 class="petit-titre" data-t="prod_hist_eol"></h3><div class="graphique moyen"><canvas id="prod-h-eol" role="img"></canvas></div></div>
      </div>
      <p class="note" data-t="prod_note"></p>
    </section>

    <!-- ============================================================ MODÈLES -->
    <section id="modeles" role="tabpanel" aria-labelledby="tab-modeles" class="panneau" hidden>
      <div class="carte">
        <h3 class="petit-titre" data-t="m_qui"></h3>
        <div class="fiches" id="m-fiches"></div>
      </div>
      <div class="carte">
        <h3 class="petit-titre" data-t="m_chaine"></h3>
        <ol class="etapes" id="m-etapes"></ol>
      </div>
      <div class="deux-cartes">
        <div class="carte">
          <h3 class="petit-titre" data-t="m_lexique"></h3>
          <dl class="lexique" id="m-lexique"></dl>
        </div>
        <div class="carte">
          <h3 class="petit-titre" data-t="m_limites"></h3>
          <ul class="points" id="m-limites"></ul>
        </div>
      </div>
    </section>

    <!-- ============================================================ SOURCES -->
    <section id="sources" role="tabpanel" aria-labelledby="tab-sources" class="panneau" hidden>
      <div class="carte">
        <p class="intro" data-t="intro_sources"></p>
        <div class="sources" id="s-liste"></div>
      </div>
      <div class="carte">
        <h3 class="petit-titre" data-t="s_outils"></h3>
        <ul class="points" id="s-outils"></ul>
      </div>
    </section>
  </main>

  <footer class="pied" id="pied"></footer>
</body>
</html>
