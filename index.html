<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prédiction du prix de l’électricité à J+1</title>
  <meta name="description" content="Prévision du prix day-ahead de l'électricité en France par trois modèles de machine learning, comparée chaque jour au prix du marché.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M18 2 6 18h8l-2 12 12-16h-8z' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=41">
  <link rel="stylesheet" href="design.css?v=12">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="infos_modeles.js?v=8" defer></script>
  <script src="app.js?v=72" defer></script>
  <script src="design.js?v=4" defer></script>
  <!-- onglets bonus retirés le 03/11/2026 (batterie.js, marches.js gardés pour plus tard) -->
</head>
<body>
  <a class="aller-contenu" href="#contenu"><span class="texte-fr">Aller au contenu</span><span class="texte-en">Skip to content</span></a>
  <aside class="navigation-laterale" aria-label="Navigation principale / Main navigation">
    <a class="identite" href="#prevision">
      <svg class="identite-signe" viewBox="0 0 40 44" aria-hidden="true"><path d="M23 3 7 24h12l-3 17 17-23H21z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="identite-nom" lang="en">Electricity price forecast<span class="identite-pays">France</span></span>
    </a>
    <nav class="onglets" role="tablist" aria-label="Sections" aria-orientation="vertical">
      <button type="button" role="tab" id="tab-prevision" data-onglet="prevision" aria-controls="prevision"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M7 14l4-5 4 3 5-7"/></svg><span data-t="o_prevision"></span></button>
      <button type="button" role="tab" id="tab-performance" data-onglet="performance" aria-controls="performance"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10m7 10V4m7 16v-7"/></svg><span data-t="o_performance"></span></button>
      <button type="button" role="tab" id="tab-production" data-onglet="production" aria-controls="production"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg><span data-t="o_production"></span></button>
    </nav>
    <details class="parametres">
      <summary>
        <svg class="parametres-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h7m4 0h5M4 12h2m4 0h10M4 18h10m4 0h2"/><circle cx="13" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>
        <span class="texte-fr">Paramètres</span><span class="texte-en">Settings</span>
      </summary>
      <div class="reglages">
        <div class="reglage">
          <span><span class="texte-fr">Langue</span><span class="texte-en">Language</span></span>
          <button type="button" id="langue" aria-label="Switch to English">EN</button>
        </div>
        <div class="reglage">
          <span id="theme-libelle"><span class="texte-fr">Mode nuit</span><span class="texte-en">Dark mode</span></span>
          <button type="button" id="theme" aria-labelledby="theme-libelle" aria-pressed="false"></button>
        </div>
      </div>
    </details>
  </aside>
  <header class="entete">
    <div class="entete-haut">
      <div class="titre-bloc">
        <h1 data-t="titre"></h1>
      </div>
    </div>
  </header>

  <main id="contenu" tabindex="-1">
    <!-- ============================================================ PRÉVISION -->
    <section id="prevision" role="tabpanel" aria-labelledby="tab-prevision" class="panneau">
      <div id="bandeau-retard" class="alerte echec" hidden></div>
      <p id="maj" class="maj"></p>
      <div id="prev-haut" class="bloc-jour"></div>
    </section>

    <!-- ============================================================ PERFORMANCE -->
    <section id="performance" role="tabpanel" aria-labelledby="tab-performance" class="panneau" hidden>
      <div class="carte">
        <p class="intro" data-t="intro_perf"></p>
        <div class="segments" id="perf-periode" role="group"></div>
        <div class="segments" id="perf-pas" role="group" aria-label="Pas"></div>
        <p class="note" id="perf-pas-note"></p>
        <div class="choix" id="perf-choix"></div>
        <div class="cadre-table libre"><table id="perf-resume" class="table-donnees"></table></div>
      </div>
      <div class="deux-cartes">
        <div class="carte">
          <h3 class="petit-titre" data-t="perf_jours"></h3>
          <div class="graphique"><canvas id="perf-jours" role="img"></canvas></div>
        </div>
        <div class="carte">
          <h3 class="petit-titre" data-t="perf_heures"></h3>
          <div class="graphique"><canvas id="perf-heures" role="img"></canvas></div>
        </div>
      </div>
      <div class="carte">
        <h3 class="petit-titre" data-t="perf_difficiles"></h3>
        <p class="note" data-t="clic_jour"></p>
        <div class="choix" id="perf-choix2"></div>
        <div class="cadre-table libre"><table id="perf-difficiles" class="table-donnees cliquable"></table></div>
      </div>
    </section>

    <!-- ============================================================ PRODUCTION (bonus) -->
    <section id="production" role="tabpanel" aria-labelledby="tab-production" class="panneau" hidden>
      <div class="carte">
        <div class="titre-jour"><h3 class="petit-titre" id="prod-titre-jour"></h3><span id="prod-badge" class="badge fort"></span></div>
        <div class="navigation-jour">
          <button type="button" id="prod-prec" class="bouton" aria-label="Jour précédent">‹</button>
          <input type="date" id="prod-date" aria-label="Date">
          <button type="button" id="prod-suiv" class="bouton" aria-label="Jour suivant">›</button>
        </div>
        <div class="choix" id="prod-choix"></div>
        <div class="duel" id="prod-duel"></div>
        <div class="duo">
          <div class="cadre-table"><table id="prod-table" class="table-donnees"></table></div>
          <div class="graphique"><canvas id="prod-g-jour" role="img"></canvas></div>
        </div>
      </div>
      <div class="carte" id="prod-rte-carte" hidden>
        <h3 class="petit-titre" id="prod-rte-titre"></h3>
        <div class="duel" id="prod-rte-duel"></div>
        <p class="note" data-t="rte_court_note"></p>
        <p class="note" data-t="rte_veille_note"></p>
        <div class="choix" id="prod-choix-hist"></div>
        <h4 class="mini-titre" data-t="rte_err_titre"></h4>
        <div class="graphique moyen"><canvas id="prod-g-err" role="img"></canvas></div>
        <details class="plus"><summary data-t="rte_detail"></summary><div class="cadre-table libre"><table id="prod-rte" class="table-donnees"></table></div></details>
      </div>
      <div class="carte"><h3 class="petit-titre" data-t="prod_regions"></h3><div class="choix" id="prod-choix-regions"></div><div class="cadre-table libre"><table id="prod-regions" class="table-donnees"></table></div></div>
      <div class="carte">
        <h3 class="petit-titre" data-t="prod_titre"></h3>
        <p class="intro" data-t="intro_prod"></p>
        <h4 class="mini-titre" data-t="rte_pourquoi"></h4>
        <p class="note" data-t="rte_note"></p>
        <p class="note" data-t="prod_hist_note"></p>
        <p class="note" data-t="prod_note"></p>
      </div>
    </section>



  </main>

  <footer class="pied" id="pied"></footer>
</body>
</html>
